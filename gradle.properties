group=io.agcmc.agc
mcVersion=26.2
# This is the current API version for use in (paper-)plugin.yml files
# During snapshot cycles this should be the anticipated version of the release target
apiVersion=26.2
channel=ALPHA

# Set to true only while actively updating the Minecraft version (re-resolves the
# mache sources repo over the network). On CI this fetch fails deterministically
# (MissingObjectException on a commit the remote no longer advertises), and a fresh
# machine has no paperweight cache to mask it. Keep false for reproducible builds.
updatingMinecraft=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
# NOTE: do NOT set systemProp.native.encoding / systemProp.sun.jnu.encoding here.
# Gradle 9.7+ writes worker @argfiles using the daemon's native.encoding; overriding it to
# UTF-8 makes the daemon write UTF-8 argfiles that the Windows launcher still decodes with the
# real ANSI code page (MS949), so every test class fails with ClassNotFoundException.
# Also note: project paths containing non-ASCII characters (e.g. ...\코딩\AGC) break test
# workers on Gradle < 9.7 (gradle/gradle#30304); this wrapper pins 9.7.0+ for that reason.
